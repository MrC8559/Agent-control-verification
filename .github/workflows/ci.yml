name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic demo
        run: python -m agent_control_verification demo
      - name: Evidence bundle handoff
        run: |
          python -m agent_control_verification evidence-demo --output /tmp/acv-evidence.json
          python -m agent_control_verification render-evidence /tmp/acv-evidence.json
      - name: macOS/Linux helper syntax
        run: |
          bash -n scripts/prepare-first-codex-probe.sh
          bash scripts/prepare-first-codex-probe.sh --help >/tmp/acv-codex-helper-help.txt
