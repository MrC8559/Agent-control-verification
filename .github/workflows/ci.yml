name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic demo
        run: python -m agent_control_verification demo
      - name: Evidence bundle handoff
        run: |
          python -m agent_control_verification evidence-demo --output /tmp/acv-evidence.json
          python -m agent_control_verification render-evidence /tmp/acv-evidence.json
