name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic demo
        run: python -m agent_control_verification demo
      - name: Evidence bundle handoff
        run: |
          python -m agent_control_verification evidence-demo --output /tmp/acv-evidence.json
          python -m agent_control_verification render-evidence /tmp/acv-evidence.json
      - name: macOS/Linux helper syntax
        run: |
          bash -n scripts/prepare-first-codex-probe.sh
          bash scripts/prepare-first-codex-probe.sh --help >/tmp/acv-codex-helper-help.txt
