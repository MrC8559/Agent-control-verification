[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-verification"
version = "0.0.1"
description = "Verify that AI-agent security decisions are enforced at the point of effect."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Agent Control Verification contributors"}]
dependencies = []

[project.scripts]
acv = "agent_control_verification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
